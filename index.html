<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐧 펭귄 알까기 - Penguin Knockout</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a2e; font-family: 'Segoe UI', sans-serif; }
        #canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD */
        #hud { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; color: white; }
        #top-bar { display: flex; justify-content: space-between; padding: 16px 24px; font-size: 1.1em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Bottom controls - visible during AIMING */
        #bottom-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; }

        /* Power slider */
        #power-section { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.6);
            padding: 12px 24px; border-radius: 12px; backdrop-filter: blur(8px); }
        #power-label { color: white; font-size: 1.1em; min-width: 80px; text-align: center; }
        #power-slider { width: 200px; height: 8px; -webkit-appearance: none; appearance: none;
            background: linear-gradient(to right, #33cc33, #ffcc00, #ff3333); border-radius: 4px;
            outline: none; cursor: pointer; pointer-events: auto; }
        #power-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px;
            background: white; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

        /* Launch button */
        #launch-btn { padding: 14px 48px; font-size: 1.4em; font-weight: bold; border: none;
            border-radius: 12px; cursor: pointer; pointer-events: auto;
            background: linear-gradient(135deg, #ff4444, #ff6644); color: white;
            box-shadow: 0 4px 15px rgba(255,68,68,0.4); transition: transform 0.1s, box-shadow 0.1s; }
        #launch-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,68,68,0.6); }
        #launch-btn:active { transform: scale(0.95); }

        /* Direction hint */
        #aim-hint { color: rgba(255,255,255,0.7); font-size: 0.9em; text-align: center; }

        /* Screen overlays */
        .screen-overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.75);
            color: white; z-index: 20; backdrop-filter: blur(4px); }
        .screen-overlay h1 { font-size: 3.5em; margin-bottom: 0.3em; }
        .screen-overlay p { font-size: 1.2em; margin-bottom: 2em; opacity: 0.8; }
        .screen-overlay button { padding: 16px 56px; font-size: 1.3em; border: none;
            border-radius: 10px; cursor: pointer; background: #4488ff; color: white;
            box-shadow: 0 4px 15px rgba(68,136,255,0.4); transition: transform 0.1s; }
        .screen-overlay button:hover { transform: scale(1.05); background: #5599ff; }

        .hidden { display: none !important; }

        /* Round banner */
        #round-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3em; font-weight: bold; color: white; text-shadow: 0 4px 12px rgba(0,0,0,0.8);
            z-index: 15; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #round-banner.show { opacity: 1; }

        /* Multiplayer UI */
        .mp-input { width: 280px; padding: 14px 20px; font-size: 1.1em; border: 2px solid #4488ff;
            border-radius: 8px; background: rgba(20,20,60,0.8); color: white; text-align: center;
            outline: none; margin-bottom: 20px; }
        .mp-input:focus { border-color: #66aaff; background: rgba(30,30,80,0.9); }
        .mp-input::placeholder { color: rgba(255,255,255,0.4); }

        .mp-divider { margin: 20px 0; color: rgba(255,255,255,0.5); font-size: 1.1em; }

        .mp-error { color: #ff6666; font-size: 1em; margin-top: 10px; min-height: 1.5em; }

        .back-btn { padding: 12px 40px !important; font-size: 1.1em !important;
            background: #666 !important; margin-top: 20px; }
        .back-btn:hover { background: #777 !important; }

        /* Lobby screen */
        #lobby-room-code { font-size: 3em; font-family: 'Courier New', monospace;
            background: rgba(68,136,255,0.2); padding: 20px 40px; border-radius: 12px;
            border: 2px solid #4488ff; margin-bottom: 30px; letter-spacing: 0.15em;
            cursor: pointer; transition: background 0.2s; }
        #lobby-room-code:hover { background: rgba(68,136,255,0.3); }

        #lobby-player-list { display: flex; flex-direction: column; gap: 12px;
            margin-bottom: 30px; width: 400px; }

        .lobby-player-card { display: flex; align-items: center; gap: 12px;
            background: rgba(20,20,60,0.6); padding: 14px 20px; border-radius: 10px;
            border-left: 4px solid #666; }

        .player-color-dot { width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid white; }

        .player-name { flex: 1; font-size: 1.2em; }

        .player-ready-badge { padding: 4px 12px; border-radius: 6px; font-size: 0.9em;
            font-weight: bold; }
        .player-ready-badge.ready { background: #33cc33; color: white; }
        .player-ready-badge.waiting { background: rgba(100,100,100,0.5); color: #ccc; }

        #ready-btn { background: #33cc33 !important; }
        #ready-btn:hover { background: #44dd44 !important; }
        #ready-btn.ready { background: #ff6644 !important; }
        #ready-btn.ready:hover { background: #ff7755 !important; }

        .lobby-hint { color: rgba(255,255,255,0.6); font-size: 1em; margin-top: 10px; }

        /* Rankings */
        #ranking-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; width: 300px; }
        .ranking-item { padding: 12px 20px; background: rgba(20,20,60,0.6); border-radius: 8px;
            font-size: 1.2em; text-align: center; }
        .ranking-item:first-child { background: rgba(255,200,0,0.2); border: 1px solid rgba(255,200,0,0.4); }

        /* Room list */
        .room-create-section, .room-join-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .mp-input-small { width: 200px; padding: 10px 16px; font-size: 1em; margin-bottom: 0; }
        .room-list { display: flex; flex-direction: column; gap: 8px; width: 400px; max-height: 240px;
            overflow-y: auto; padding: 4px; }
        .room-list:empty::after { content: '방이 없습니다'; color: rgba(255,255,255,0.4);
            text-align: center; padding: 20px; font-size: 1em; }
        .room-card { display: flex; align-items: center; gap: 12px; background: rgba(20,20,60,0.6);
            padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: background 0.2s;
            border: 1px solid rgba(68,136,255,0.2); }
        .room-card:hover { background: rgba(40,40,100,0.8); border-color: rgba(68,136,255,0.5); }
        .room-card.in-game { cursor: default; opacity: 0.7; }
        .room-card.in-game:hover { background: rgba(20,20,60,0.6); border-color: rgba(68,136,255,0.2); }
        .room-card-code { font-family: 'Courier New', monospace; font-size: 1.2em; font-weight: bold;
            color: #4488ff; min-width: 50px; }
        .room-card-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .room-card-host { font-size: 1em; color: white; }
        .room-card-players { font-size: 0.85em; color: rgba(255,255,255,0.6); }
        .room-card-right { display: flex; align-items: center; gap: 8px; }
        .room-status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; }
        .room-status-badge.lobby { background: rgba(51,204,51,0.3); color: #33cc33; }
        .room-status-badge.playing { background: rgba(255,160,0,0.3); color: #ffa000; }
        .room-lock-icon { font-size: 1.1em; }

        /* Password modal */
        .password-modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); z-index: 30; backdrop-filter: blur(4px); }
        .password-modal-content { background: rgba(20,20,60,0.95); padding: 30px 40px; border-radius: 16px;
            border: 1px solid #4488ff; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .password-modal-content h2 { color: white; font-size: 1.3em; margin: 0; }
        .password-modal-buttons { display: flex; gap: 12px; }
        .password-modal-buttons button { padding: 10px 30px; font-size: 1.1em; border: none; border-radius: 8px;
            cursor: pointer; color: white; transition: transform 0.1s; }
        .password-modal-buttons button:first-child { background: #4488ff; }
        .password-modal-buttons button:first-child:hover { background: #5599ff; transform: scale(1.05); }

        /* Score board (HUD top-right) */
        #score-board { position: fixed; top: 50px; right: 16px; z-index: 10;
            background: rgba(0,0,0,0.5); border-radius: 10px; padding: 10px 14px;
            backdrop-filter: blur(4px); min-width: 120px; pointer-events: none; }
        .score-board-item { display: flex; align-items: center; gap: 8px;
            color: white; font-size: 0.95em; padding: 3px 0; }
        .score-color-dot { width: 12px; height: 12px; border-radius: 50%;
            display: inline-block; flex-shrink: 0; }

        /* Round end screen */
        #round-end-screen h1 { font-size: 2.5em; }
        .round-end-scores { display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 24px; width: 300px; }
        .round-end-score-item { padding: 12px 20px; background: rgba(20,20,60,0.6);
            border-radius: 8px; font-size: 1.2em; text-align: center; color: white; }
        .round-end-score-item:first-child { background: rgba(255,200,0,0.2);
            border: 1px solid rgba(255,200,0,0.4); }
        #round-end-next { color: rgba(255,255,255,0.6); font-size: 1em;
            animation: pulse-banner 1.5s ease-in-out infinite; }

        /* Reconnect banner */
        #reconnect-banner { position: fixed; top: 0; left: 0; width: 100%; padding: 16px;
            background: rgba(255,160,0,0.9); color: white; text-align: center; font-size: 1.1em;
            font-weight: bold; z-index: 100; animation: pulse-banner 1.5s ease-in-out infinite; }
        @keyframes pulse-banner { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="reconnect-banner" class="hidden">서버에 재연결 중...</div>

    <!-- Name Input Screen -->
    <div id="name-screen" class="screen-overlay">
        <h1>🐧 펭귄 알까기</h1>
        <p>닉네임을 입력하세요</p>
        <input type="text" id="name-input" class="mp-input" placeholder="닉네임 (최대 10자)" maxlength="10">
        <button id="name-submit-btn">확인</button>
    </div>

    <!-- Room Screen -->
    <div id="room-screen" class="screen-overlay hidden">
        <h1>🐧 펭귄 알까기</h1>
        <div class="room-create-section">
            <input type="text" id="create-password-input" class="mp-input mp-input-small" placeholder="비밀번호 (선택)" maxlength="4">
            <button id="create-room-btn">방 만들기</button>
        </div>
        <div class="mp-divider">또는</div>
        <div class="room-join-section">
            <input type="text" id="room-code-input" class="mp-input mp-input-small" placeholder="방 코드 (4자리)" maxlength="4">
            <input type="text" id="join-password-input" class="mp-input mp-input-small" placeholder="비밀번호" maxlength="4">
            <button id="join-room-btn">참가하기</button>
        </div>
        <div id="room-error" class="mp-error"></div>
        <div class="mp-divider">방 목록</div>
        <div id="room-list" class="room-list"></div>
        <button id="room-back-btn" class="back-btn">뒤로</button>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="password-modal hidden">
        <div class="password-modal-content">
            <h2>비밀번호 입력</h2>
            <input type="text" id="modal-password-input" class="mp-input" placeholder="비밀번호 (4자리)" maxlength="4">
            <div class="password-modal-buttons">
                <button id="modal-password-submit">확인</button>
                <button id="modal-password-cancel" class="back-btn">취소</button>
            </div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen-overlay hidden">
        <h1>대기실</h1>
        <div id="lobby-room-code" title="클릭하여 복사">----</div>
        <div id="lobby-player-list"></div>
        <button id="ready-btn">준비</button>
        <button id="leave-room-btn" class="back-btn">방 나가기</button>
        <p class="lobby-hint">최소 2명이 필요합니다</p>
    </div>

    <!-- Menu -->
    <div id="menu-screen" class="screen-overlay hidden">
        <h1>🐧 펭귄 알까기</h1>
        <p>빙판 위에서 펭귄을 튕겨 상대를 밀어내자!</p>
        <button id="start-btn">게임 시작</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div id="top-bar">
            <span id="round-display">라운드 1</span>
            <span id="alive-display">🐧 x4</span>
        </div>
    </div>
    <div id="score-board" class="hidden"></div>

    <!-- Bottom Controls (aiming phase) -->
    <div id="bottom-controls" class="hidden">
        <div id="aim-hint">드래그하여 방향을 정하세요</div>
        <div id="power-section">
            <span id="power-label">강도: 5</span>
            <input type="range" id="power-slider" min="1" max="10" value="5" step="1">
        </div>
        <button id="launch-btn">🚀 발사!</button>
    </div>

    <!-- Round Banner -->
    <div id="round-banner"></div>

    <!-- Round End -->
    <div id="round-end-screen" class="screen-overlay hidden">
        <h1 id="round-end-title"></h1>
        <div id="round-end-scores" class="round-end-scores"></div>
        <p id="round-end-next">다음 라운드 준비중...</p>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="screen-overlay hidden">
        <h1 id="gameover-title">🏆 승리!</h1>
        <p id="gameover-subtitle"></p>
        <div id="ranking-list" class="hidden"></div>
        <button id="restart-btn">다시 하기</button>
        <button id="return-lobby-btn" class="back-btn">로비로 돌아가기</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
